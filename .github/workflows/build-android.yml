name: Build Android APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            --sdk_root=$ANDROID_HOME || true

      - name: Install dependencies
        run: npm ci

      - name: Build AriaNg web assets
        run: npm run build

      - name: Install Capacitor 6.x
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6
          npm install @capacitor/android@6

      - name: Add Android platform
        run: npx cap add android

      - name: Debug - show generated gradle files
        run: |
          echo "=== android/variables.gradle ==="
          cat android/variables.gradle 2>/dev/null || echo "(not found)"
          echo ""
          echo "=== android/app/build.gradle ==="
          cat android/app/build.gradle
          echo ""
          echo "=== android/build.gradle ==="
          cat android/build.gradle

      - name: Configure Android SDK version
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i "s/compileSdkVersion = [0-9]*/compileSdkVersion = 36/" android/variables.gradle
            sed -i "s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/" android/variables.gradle
            echo "Updated variables.gradle:"
            cat android/variables.gradle
          fi

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/ariang-release.keystore
            python3 scripts/inject-signing.py android/app/build.gradle
            echo "Signing configured. Updated build.gradle:"
            cat android/app/build.gradle
          else
            echo "No keystore secret found, skipping signing."
          fi

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: AriaNg-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: AriaNg-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
