name: Build Android APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. 设置 JDK 17 (Android Gradle 需要)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. 设置 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: '36.0.0'

      # 5. 安装项目依赖并构建 Web 资源
      - name: Install dependencies
        run: npm ci

      - name: Build AriaNg web assets
        run: npm run build

      # 6. 安装 Capacitor
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest
          npm install @capacitor/android@latest

      # 7. 添加 Android 平台并同步资源
      - name: Add Android platform
        run: npx cap add android

      # 8. 配置 Android 16 (API 36) 目标版本
      - name: Configure Android target SDK to API 36 (Android 16)
        run: |
          # 修改 build.gradle 中的 SDK 版本
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/' android/app/build.gradle
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' android/app/build.gradle

          # 如果使用 variables.gradle，也修改那里
          if [ -f android/variables.gradle ]; then
            sed -i "s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/" android/variables.gradle
            sed -i "s/compileSdkVersion = [0-9]*/compileSdkVersion = 36/" android/variables.gradle
          fi

      # 9. 解码签名密钥并配置 Gradle 签名
      - name: Decode keystore and configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/ariang-release.keystore

            # 在现有 android 块内注入 signingConfigs
            sed -i '/^android {/a\    signingConfigs {\n        release {\n            storeFile file("ariang-release.keystore")\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n        }\n    }' android/app/build.gradle

            # 给现有的 release buildType 加上 signingConfig
            sed -i '/buildTypes {/,/release {/ { /release {/a\            signingConfig signingConfigs.release }' android/app/build.gradle

            echo "Release signing configured."
          else
            echo "No keystore secret found, skipping signing."
          fi

      # 10. 打印 build.gradle 用于调试
      - name: Debug - print build.gradle
        run: cat android/app/build.gradle

      # 11. 同步 Web 资源到 Android 项目
      - name: Sync web assets to Android
        run: npx cap sync android

      # 12. 构建 Debug APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 13. 构建 Release APK
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      # 14. 上传 Debug APK 产物
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AriaNg-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 15. 上传 Release APK 产物
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AriaNg-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
